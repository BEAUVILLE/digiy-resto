name: Raccorder réglages RESA RESTO
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-resa-resto-reglages-link.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clarifier les réglages facultatifs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('resa-resto/gestion.html')
          s=p.read_text()
          old='<a class="back" href="./index.html">← Vue client</a></header>'
          new='<div style="display:flex;gap:7px;flex-wrap:wrap"><a class="back" href="./reglages.html">⚙️ Réglages facultatifs</a><a class="back" href="./index.html">← Vue client</a></div></header>'
          if 'href="./reglages.html"' not in s and old in s:
              s=s.replace(old,new,1)
          s=s.replace('<div class="rule"><strong>Règles actives</strong><br>Table garantie <b>15 minutes</b> après l’heure réservée. Au 1er service, la libération avant le 2e service ne s’applique que si cette table est réellement réservée ensuite.</div>','<div class="rule"><strong>Règles du restaurant</strong><br>Réservation garantie <b>15 minutes</b> après l’heure choisie. Plan détaillé de tables et organisation en 2 services : <b>facultatifs</b> via ⚙️ Réglages.</div>')
          s=s.replace('<p class="hint">L’adhérent peut modifier ces horaires.</p>','<p class="hint">Horaires modifiables. L’organisation en 2 services est facultative.</p>')
          s=s.replace('<p class="hint">Chaque grand carré représente un secteur réel du restaurant.</p>','<p class="hint">Structure indicative · facultative. Chaque grand carré peut représenter un secteur réel du restaurant.</p>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add resa-resto/gestion.html
          git diff --cached --quiet && exit 0
          git commit -m "Clarifier les options facultatives RESA RESTO"
          git push