name: Add starting-price wording RESTO
on:
  push:
    paths:
      - '.github/workflows/from-price-20260822.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update membership wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pairs=[
          ('DEMANDE D’ADHÉSION · 28 000 FCFA / mois','DEMANDE D’ADHÉSION · À PARTIR DE 28 000 FCFA / mois'),
          ('MEMBERSHIP REQUEST · 28,000 FCFA / month','MEMBERSHIP REQUEST · FROM 28,000 FCFA / month'),
          ('SOLICITUD DE ADHESIÓN · 28 000 FCFA / mes','SOLICITUD DE ADHESIÓN · DESDE 28 000 FCFA / mes'),
          ('PEDIDO DE ADESÃO · 28 000 FCFA / mês','PEDIDO DE ADESÃO · A PARTIR DE 28 000 FCFA / mês'),
          ('MITGLIEDSCHAFT ANFRAGEN · 28.000 FCFA / Monat','MITGLIEDSCHAFT ANFRAGEN · AB 28.000 FCFA / Monat'),
          ('RICHIESTA DI ADESIONE · 28 000 FCFA / mese','RICHIESTA DI ADESIONE · DA 28 000 FCFA / mese'),
          ('LIDMAATSCHAP AANVRAGEN · 28.000 FCFA / maand','LIDMAATSCHAP AANVRAGEN · VANAF 28.000 FCFA / maand'),
          ('طلب العضوية · 28,000 فرنك CFA / شهر','طلب العضوية · ابتداءً من 28,000 فرنك CFA / شهر')]
          if pairs[0][0] not in s: raise SystemExit('French RESTO price marker missing')
          for a,b in pairs: s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "DIGIYLYFE"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/from-price-20260822.yml
          git add index.html
          git diff --cached --quiet || git commit -m "UI: show RESTO membership as starting price"
          git push