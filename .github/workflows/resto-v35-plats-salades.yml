name: RESTO V35 Plats et Salades

on:
  pull_request:
    paths:
      - "prototypes/resto-v35-plats-salades.*"
      - "resa-resto/ma-carte.html"
      - "resa-resto/gestion.html"
      - "tests/resto-v35-plats-salades.test.cjs"
      - ".github/workflows/resto-v35-plats-salades.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier JS
        run: |
          node --check prototypes/resto-v35-plats-salades.js
          node --check tests/resto-v35-plats-salades.test.cjs
      - name: Tests Plats & Salades
        run: node --test tests/resto-v35-plats-salades.test.cjs
