name: Patch RESTO return once

on:
  push:
    paths:
      - '.github/workflows/patch-resto-return-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insert direct DIGIYLYFE return
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data-digiy-return-home="1"'
          if marker not in s:
              anchor = '''  <a data-digiy-return-home="1" href="https://digiylyfe.com/" aria-label="Retour DIGIYLYFE.COM" style="width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;margin:0 0 14px;padding:11px 18px;border:2px solid #d8ad46;border-radius:999px;background:#073f32;color:#fff;text-decoration:none;font:950 15px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.02em;box-shadow:0 8px 20px rgba(7,63,50,.20)">← RETOUR DIGIYLYFE.COM</a>\n'''
              s = s.replace('<main>\n', '<main>\n' + anchor, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/patch-resto-return-once.yml
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add -A
          git commit -m "UI: add DIGIYLYFE.COM return on RESTO" || exit 0
          git push origin main
