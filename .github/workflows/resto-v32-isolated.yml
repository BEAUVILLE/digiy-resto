name: RESTO V32 isolated restaurant-local booking time
on:
  pull_request:
    paths:
      - 'supabase/candidates/RESA_RESTO_V32_LOCAL_TIME_CANDIDATE.sql'
      - 'tests/resa-resto-v32/**'
      - '.github/workflows/resto-v32-isolated.yml'
      - 'docs/audits/RESA_RESTO_V32_LOCAL_TIME_AUDIT_2026-10-09.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-postgres:
    name: RESTO V32 PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: resto_v32_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resto_v32_synthetic"
          --health-interval 4s
          --health-timeout 3s
          --health-retries 20
    env:
      RESTO_V32_SYNTHETIC_DB_URL: postgresql://postgres:synthetic-only@127.0.0.1:5432/resto_v32_synthetic
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Reproduce prior issue and verify corrected time rules in disposable DB
        run: bash tests/resa-resto-v32/run-synthetic.sh
