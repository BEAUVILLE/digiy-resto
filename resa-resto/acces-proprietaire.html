<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#073f32">
<title>Accès propriétaire RÉSA RESTO — DIGIYLYFE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#073f32;--g2:#0b5d48;--gold:#d8ad46;--cream:#f5f1e6;--ink:#16342c;--muted:#6f7f79;--line:#dfe7e2;--red:#a3231d}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:linear-gradient(180deg,var(--g),var(--g2) 34%,var(--cream) 34%);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(620px,calc(100% - 22px));margin:auto;padding:18px 0 42px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#fff}.brand{font-weight:1000}.back{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900}.hero{color:#fff;padding:30px 2px 25px}.hero h1{font-size:clamp(38px,9vw,62px);line-height:.94;margin:8px 0}.hero p{color:#e8f2ed;font-weight:760;line-height:1.5}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(18px,5vw,28px);box-shadow:0 20px 48px #073f3230}.sites{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}.site{border:1px solid #b9cdc2;background:#fff;color:var(--g);border-radius:16px;padding:12px;font-weight:950;cursor:pointer}.site.active{background:var(--g);color:#fff}.field{display:grid;gap:6px;margin-top:12px}.field label{font-size:10px;font-weight:1000;text-transform:uppercase;color:var(--muted)}input{width:100%;min-height:50px;border:1px solid #cbd9d1;border-radius:13px;padding:11px 12px;font:inherit}.btn{width:100%;margin-top:12px;border:0;border-radius:999px;min-height:50px;padding:11px 16px;background:var(--g);color:#fff;font:inherit;font-weight:1000;cursor:pointer}.gold{background:var(--gold);color:#173f35}.status{min-height:21px;margin-top:11px;font-size:12px;font-weight:900;line-height:1.45;white-space:pre-line}.bad{color:var(--red)}.hidden{display:none!important}.hint{margin-top:13px;color:var(--muted);font-size:11px;line-height:1.5;font-weight:750}@media(max-width:520px){.sites{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">🍽️ DIGIY RÉSA RESTO</div><a class="back" href="../">← RESTO</a></header>
<section class="hero"><div style="font-size:10px;font-weight:1000;letter-spacing:.12em;color:#ffe8a0">ESPACE PROPRIÉTAIRE</div><h1>Entrer dans ma gestion.</h1><p>Choisissez votre restaurant, recevez votre accès sécurisé, puis ouvrez directement votre espace de gestion.</p></section>
<section class="card">
<div class="sites">
<button class="site" type="button" data-site="test-resa-resto-saly">TEST SALY</button>
<button class="site" type="button" data-site="modele-resa-resto-sarlat">TEST SARLAT</button>
<button class="site" type="button" data-site="entre2-sarlat">L’ENTRE 2 · SARLAT</button>
</div>
<div class="field"><label>Email propriétaire</label><input id="email" type="email" autocomplete="email" placeholder="Votre email"></div>
<button class="btn" id="send" type="button">RECEVOIR MON ACCÈS →</button>
<div id="otpBox" class="hidden">
<div class="field"><label>Code reçu</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></div>
<button class="btn gold" id="verify" type="button">OUVRIR MA GESTION →</button>
</div>
<div class="status" id="status" aria-live="polite"></div>
<p class="hint">Le lien email et le code ouvrent la même gestion. Aucun passage par PRO ESPACE ni par l’index public.</p>
</section>
</div>
<script>
(()=>{'use strict';
const URL='https://wesqmwjjtsefyjnluosj.supabase.co';
const KEY='sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3';
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let site=params.get('site')||'test-resa-resto-saly';
const allowed=new Set(['test-resa-resto-saly','modele-resa-resto-sarlat','entre2-sarlat']);
// A malformed or unknown site must NEVER be silently switched to another restaurant.
if(!allowed.has(site))site='';

function paint(){
  document.querySelectorAll('.site').forEach(b=>b.classList.toggle('active',b.dataset.site===site));
  const valid=allowed.has(site);
  $('send').disabled=!valid;
  $('verify').disabled=!valid;
  if(!valid)msg('⚠️ Restaurant inconnu. Sélectionnez un établissement autorisé.',true);
}
function managementUrl(){return './gestion.html?site='+encodeURIComponent(site)}
function redirectUrl(){return location.origin+location.pathname+'?site='+encodeURIComponent(site)}
function msg(t,bad=false){$('status').textContent=t||'';$('status').classList.toggle('bad',!!bad)}
async function openIfSession(){
  if(!allowed.has(site))return false;
  const {data}=await db.auth.getSession();
  if(data&&data.session){location.replace(managementUrl());return true}
  return false;
}
document.querySelectorAll('.site').forEach(b=>b.addEventListener('click',()=>{site=b.dataset.site;history.replaceState(null,'',location.pathname+'?site='+encodeURIComponent(site));msg('');paint()}));
$('send').addEventListener('click',async()=>{
  if(!allowed.has(site))return msg('Restaurant inconnu.',true);
  const email=$('email').value.trim();
  if(!email)return msg('Indiquez votre email propriétaire.',true);
  $('send').disabled=true;msg('Envoi de votre accès sécurisé…');
  const {error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:redirectUrl()}});
  $('send').disabled=false;
  if(error)return msg('⚠️ '+error.message,true);
  $('otpBox').classList.remove('hidden');
  msg('Email envoyé. Cliquez sur le lien reçu ou saisissez le code.');
});
$('verify').addEventListener('click',async()=>{
  if(!allowed.has(site))return msg('Restaurant inconnu.',true);
  const email=$('email').value.trim(),token=$('otp').value.trim();
  if(!email||!/^[0-9]{6,10}$/.test(token))return msg('Entrez le code reçu par email.',true);
  $('verify').disabled=true;
  const {data,error}=await db.auth.verifyOtp({email,token,type:'email'});
  $('verify').disabled=false;
  if(error)return msg('⚠️ Code invalide ou expiré.',true);
  if(data&&data.session)location.replace(managementUrl());
});
db.auth.onAuthStateChange((event,session)=>{if(allowed.has(site)&&event==='SIGNED_IN'&&session)setTimeout(()=>location.replace(managementUrl()),0)});
paint();
openIfSession();
})();
</script>
</body>
</html>
