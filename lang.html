<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#020617">
  <title>DIGIY RESTO — langue</title>
  <style>html,body{margin:0;min-height:100%;background:#020617;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;text-align:center}p{padding:24px;font-weight:900}</style>
</head>
<body>
  <p>DIGIY RESTO…</p>
  <script>
  (function(){
    var supported=['fr','en','es','de','it','nl','ar'];
    var lang=(new URLSearchParams(location.search).get('lang')||'fr').slice(0,2).toLowerCase();
    if(supported.indexOf(lang)<0)lang='fr';
    try{localStorage.setItem('digiy-resto-lang',lang)}catch(e){}
    location.replace('/?lang='+encodeURIComponent(lang)+'&v=20260730-resto7a');
  })();
  </script>
  <noscript><a href="/?lang=fr">Ouvrir DIGIY RESTO</a></noscript>
</body>
</html>
